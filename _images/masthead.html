<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
    /* Drawn at 2x: every length is double the site's. */
    :root {
        --night: #100c14;
        --night-raised: #16111b;
        --night-card: #1c1622;
        --line: #2d2436;
        --line-strong: #463a52;
        --text: #ece3d0;
        --muted: #a99fae;
        --candle: #e8c27c;
        --candle-bright: #f3d59c;
        --moon: #ab95e3;
        --serif: "Fraunces", Georgia, serif;
        --fell-sc: "IM Fell English SC", Georgia, serif;
        --sans: "Geist", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
    }

    html,
    body {
        width: 1640px;
        height: 540px;
        overflow: hidden;
        background: var(--night);
    }

    .canvas {
        position: relative;
        width: 1640px;
        height: 540px;
        overflow: hidden;
        background:
            radial-gradient(2px 2px at 46px 82px, rgba(255, 238, 205, 0.9), transparent) 0 0 / 620px 620px,
            radial-gradient(2px 2px at 342px 192px, rgba(255, 238, 205, 0.6), transparent) 0 0 / 620px 620px,
            radial-gradient(3px 3px at 524px 426px, rgba(255, 238, 205, 0.8), transparent) 0 0 / 620px 620px,
            radial-gradient(2px 2px at 176px 536px, rgba(171, 149, 227, 0.8), transparent) 0 0 / 620px 620px,
            radial-gradient(2px 2px at 280px 60px, rgba(255, 238, 205, 0.5), transparent) 0 0 / 940px 940px,
            radial-gradient(3px 3px at 800px 320px, rgba(232, 194, 124, 0.7), transparent) 0 0 / 940px 940px,
            radial-gradient(2px 2px at 620px 820px, rgba(255, 238, 205, 0.7), transparent) 0 0 / 940px 940px,
            radial-gradient(rgba(236, 227, 208, 0.06) 2px, transparent 3.2px) 0 0 / 48px 48px,
            var(--night);
    }

    .glow {
        position: absolute;
        border-radius: 50%;
        translate: -50% -50%;
        background:
            radial-gradient(circle at 45% 55%, rgba(232, 194, 124, 0.26), transparent 60%),
            radial-gradient(circle, rgba(171, 149, 227, 0.32), transparent 70%);
        filter: blur(60px);
    }

    .product {
        position: absolute;
        transform-origin: 0 0;
        filter: drop-shadow(0 40px 50px rgba(0, 0, 0, 0.7));
    }

    svg.leaders {
        position: absolute;
        inset: 0;
        width: 1640px;
        height: 540px;
        overflow: visible;
    }

    .leaders path {
        fill: none;
        stroke: var(--moon);
        stroke-opacity: 0.75;
        stroke-width: 2;
    }

    .leaders circle {
        fill: var(--candle-bright);
        filter: drop-shadow(0 0 6px rgba(232, 194, 124, 0.9));
    }

    .chip {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        max-width: 290px;
        padding: 9px 16px;
        border: 2px solid var(--line-strong);
        border-radius: 6px;
        background: rgba(28, 22, 34, 0.92);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        font-family: var(--mono);
        font-size: 20px;
        line-height: 1.35;
        color: var(--text);
    }

    .chip.has-label {
        padding-left: 10px;
        max-width: none;
        white-space: nowrap;
    }

    .chip .label {
        padding: 2px 12px;
        border-radius: 4px;
        background: var(--moon);
        color: var(--night);
        font-weight: 700;
    }

    .band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 56px;
        border-top: 2px solid var(--line-strong);
        background: var(--night-raised);
        z-index: 2;
    }

    .band h1 {
        font-family: var(--serif);
        font-size: 40px;
        font-weight: 400;
        font-variation-settings: "SOFT" 20, "WONK" 0;
        letter-spacing: -0.02em;
        color: var(--text);
        white-space: nowrap;
    }

    .band h1 .sep {
        color: var(--moon);
        padding: 0 0.3em;
    }

    .band h1 em {
        font-variation-settings: "SOFT" 100, "WONK" 1;
        color: var(--candle);
    }

    .band img {
        height: 44px;
    }

    .features {
        position: absolute;
        left: 72px;
        top: 70px;
    }

    .features h2 {
        font-family: var(--fell-sc);
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: var(--candle);
        margin-bottom: 22px;
    }

    .features ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 12px;
        font-family: var(--sans);
        font-size: 30px;
        color: var(--text);
    }

    .features li::before {
        content: "✦";
        margin-right: 18px;
        font-size: 0.7em;
        color: var(--candle);
        vertical-align: 0.15em;
    }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
// Products: image, scale, and either the canvas point the centre of the
// hardware (box, in the image's own pixels) sits on, or a top-left x, y.
// Columns: chips stacked with even gaps between top and bottom, their leader
// edge aligned on x. Chips: text, the product and point they mark, and a
// column; or a side, x, y and elbow for a chip above or below the hardware.
const MASTHEADS = {
    "s2-module": {
        title: ["S2 Module", "LTE-enabled IoT, right out of the box."],
        products: {
            int: { src: "src/s2-module.webp", box: [34, 28, 766, 772], cx: 494, cy: 222, s: 0.455 },
            ext: { src: "src/s2-module-ext-ant.webp", box: [34, 28, 766, 772], cx: 1146, cy: 222, s: 0.455 },
        },
        columns: {
            L: { x: 308, align: "r", top: 40, bottom: 404 },
            M: { x: 680, align: "l", top: 40, bottom: 404, w: 280 },
            R: { x: 1332, align: "l", top: 90, bottom: 354 },
        },
        chips: [
            { text: "Integrated antenna", on: "int", at: [250, 48], col: "L" },
            { text: "Multiple IO with I2C, SPI, analog & more", on: "int", at: [70, 400], col: "L" },
            { text: "One click pairing", on: "int", at: [400, 598], col: "L" },
            { text: "Powerful LTE enabled SoC", on: "int", at: [400, 300], col: "M" },
            { text: "Integrated PMIC with battery charger", on: "int", at: [400, 450], col: "M" },
            { text: "Wide range of power options", on: "int", at: [580, 690], col: "M" },
            { label: "U.FL", text: "LTE antenna", on: "ext", at: [532, 268], col: "R" },
            { label: "U.FL", text: "GPS antenna", on: "ext", at: [185, 330], col: "R" },
            { label: "50 × 50 mm", text: "footprint", col: "R" },
        ],
    },
    "s1-module": {
        title: ["S1 Module", "Accelerating ML & DSP workloads on tiny edge devices."],
        products: {
            top: { src: "cut/s1-top.png", box: [14, 12, 176, 330], cx: 475, cy: 222, s: 1.12 },
            bottom: { src: "cut/s1-bottom.png", box: [11, 13, 173, 336], cx: 1165, cy: 222, s: 1.12 },
        },
        columns: {
            L: { x: 364, align: "r", top: 60, bottom: 384 },
            M1: { x: 586, align: "l", top: 150, bottom: 340 },
            M2: { x: 1054, align: "r", top: 110, bottom: 380 },
            R: { x: 1276, align: "l", top: 60, bottom: 384, w: 330 },
        },
        chips: [
            { text: "Integrated antenna", on: "top", at: [62, 68], col: "L" },
            { text: "FPGA", on: "top", at: [62, 185], col: "L" },
            { text: "Flash memory", on: "top", at: [62, 257], col: "L" },
            { text: "Bluetooth", on: "top", at: [132, 193], col: "M1" },
            { text: "Power IC", on: "top", at: [132, 270], col: "M1" },
            { text: "LiPo charger", on: "bottom", at: [13, 150], col: "M2" },
            { text: "DC/DC & LDO outputs", on: "bottom", at: [13, 225], col: "M2" },
            { text: "ADC", on: "bottom", at: [13, 300], col: "M2" },
            { label: "6 × 11.5 mm", text: "footprint", col: "R" },
            { text: "Integrated crystals & decoupling", on: "bottom", at: [120, 175], col: "R" },
            { text: "High speed IO", on: "bottom", at: [172, 295], col: "R" },
        ],
    },
    "s1-popout-board": {
        title: ["S1 Popout Board", "Test out sensors, batteries & algorithms fast."],
        products: {
            board: { src: "src/s1-popout-board.webp", box: [3, 4, 943, 495], cx: 820, cy: 250, s: 0.66 },
        },
        columns: {
            L: { x: 489, align: "r", top: 88, bottom: 412, w: 330 },
            R: { x: 1151, align: "l", top: 88, bottom: 412, w: 340 },
        },
        chips: [
            { text: "Cortex debug port", on: "board", at: [415, 245], side: "r", x: 752, y: 40, elbow: true },
            { text: "User button & LED", on: "board", at: [618, 240], side: "l", x: 946, y: 40, elbow: true },
            { text: "Li-Po battery port", on: "board", at: [150, 80], col: "L" },
            { text: "StemmaQT / Qwiic compatible sensor port", on: "board", at: [45, 255], col: "L" },
            { text: "USB charging & data", on: "board", at: [170, 420], col: "L" },
            { text: "S1 Module pre-soldered", on: "board", at: [905, 240], col: "R" },
            { text: "All IO broken out", on: "board", at: [830, 432], col: "R" },
        ],
    },
    "s1-ecg-kit": {
        title: ["S1 ECG Kit", "An all-in-one device to build & test heart algorithms with ease."],
        products: {
            board: { src: "cut/ecg.png", box: [16, 20, 682, 280], cx: 820, cy: 222, s: 1.05 },
        },
        columns: {
            L: { x: 450, align: "r", top: 86, bottom: 358 },
            R: { x: 1190, align: "l", top: 86, bottom: 358, w: 340 },
        },
        chips: [
            { text: "Current measurement port", on: "board", at: [221, 32], side: "r", x: 655, y: 36, elbow: true, w: 340 },
            { text: "S1 Module pre-soldered", on: "board", at: [347, 32], side: "l", x: 848, y: 36, elbow: true, w: 340 },
            { text: "3-probe ECG measurement", on: "board", at: [100, 150], col: "L", w: 340 },
            { text: "LED bar graph", on: "board", at: [330, 190], col: "L" },
            { text: "Cortex debug port", on: "board", at: [480, 70], col: "R" },
            { text: "Low power ECG frontend", on: "board", at: [430, 162], col: "R" },
            { text: "Integrated LiPo battery", on: "board", at: [221, 272], side: "r", x: 655, y: 408, elbow: true, w: 340 },
            { text: "USB charging", on: "board", at: [347, 272], side: "l", x: 848, y: 408, elbow: true },
        ],
    },
    "s1-micropython": {
        title: ["MicroPython", "Prototype and test your FPGA algorithms faster."],
        products: {
            board: { src: "cut/upy-board.png", x: 640, y: -2, s: 1.1 },
            snake: { src: "cut/upy-snake.png", x: 1310, y: 70, s: 1.08 },
        },
        features: ["FPGA binary upload", "Data read/write", "Fully wireless", "Low power friendly", "Complete PMIC control"],
        columns: {},
        chips: [],
    },
};

const name = new URLSearchParams(location.search).get("p");
const m = MASTHEADS[name];
const canvas = document.getElementById("canvas");
const el = (tag, cls, parent = canvas) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    parent.append(e);
    return e;
};

const point = (p, [px, py]) => [p.x + px * p.s, p.y + py * p.s];

async function draw() {
    // Load every face before measuring chips or taking the screenshot.
    await Promise.all(
        ["40px Fraunces", "italic 40px Fraunces", "34px 'IM Fell English SC'", "30px Geist",
         "20px 'JetBrains Mono'", "bold 20px 'JetBrains Mono'"].map((f) => document.fonts.load(f)),
    );
    for (const p of Object.values(m.products)) {
        const img = el("img", "product");
        img.src = p.src;
        await img.decode();
        if (p.box) {
            const [x0, y0, x1, y1] = p.box;
            p.x = p.cx - ((x0 + x1) / 2) * p.s;
            p.y = p.cy - ((y0 + y1) / 2) * p.s;
        }
        p.w = img.naturalWidth * p.s;
        p.h = img.naturalHeight * p.s;
        Object.assign(img.style, { left: p.x + "px", top: p.y + "px", width: p.w + "px" });
        const glow = el("div", "glow");
        const size = Math.max(p.w, p.h) * 1.05;
        Object.assign(glow.style, {
            left: p.x + p.w / 2 + "px",
            top: p.y + p.h / 2 + "px",
            width: size + "px",
            height: size + "px",
        });
        canvas.insertBefore(glow, canvas.firstChild);
    }

    if (m.features) {
        const f = el("div", "features");
        el("h2", "", f).textContent = "Compatible with all S1 products";
        const ul = el("ul", "", f);
        for (const t of m.features) el("li", "", ul).textContent = t;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.classList.add("leaders");
    canvas.append(svg);

    const leader = (d, [tx, ty]) => {
        const path = document.createElementNS(svg.namespaceURI, "path");
        path.setAttribute("d", d);
        const dot = document.createElementNS(svg.namespaceURI, "circle");
        dot.setAttribute("cx", tx);
        dot.setAttribute("cy", ty);
        dot.setAttribute("r", 7);
        svg.append(path, dot);
    };

    for (const c of m.chips) {
        c.el = el("div", "chip" + (c.label ? " has-label" : ""));
        if (c.label) el("span", "label", c.el).textContent = c.label;
        const w = c.w ?? m.columns[c.col]?.w;
        if (w) c.el.style.maxWidth = w + "px";
        el("span", "", c.el).append(c.text);
    }

    for (const [key, col] of Object.entries(m.columns)) {
        const chips = m.chips.filter((c) => c.col === key);
        const heights = chips.map((c) => c.el.offsetHeight);
        const gap = (col.bottom - col.top - heights.reduce((a, b) => a + b, 0)) / (chips.length + 1);
        let y = col.top + gap;
        chips.forEach((c, i) => {
            const w = c.el.offsetWidth;
            const left = col.align === "r" ? col.x - w : col.x;
            Object.assign(c.el.style, { left: left + "px", top: y + "px" });
            if (c.on) leader(`M${col.x} ${y + heights[i] / 2} L${point(m.products[c.on], c.at)}`, point(m.products[c.on], c.at));
            y += heights[i] + gap;
        });
    }

    for (const c of m.chips.filter((c) => !c.col)) {
        const w = c.el.offsetWidth;
        const h = c.el.offsetHeight;
        const [tx, ty] = point(m.products[c.on], c.at);
        const left = c.side === "r" ? c.x - w : c.x;
        Object.assign(c.el.style, { left: left + "px", top: c.y - h / 2 + "px" });
        leader(c.elbow ? `M${c.x} ${c.y} H${tx} V${ty}` : `M${c.x} ${c.y} L${tx} ${ty}`, [tx, ty]);
    }

    const band = el("div", "band");
    const h1 = el("h1", "", band);
    h1.append(m.title[0]);
    el("span", "sep", h1).textContent = "·";
    el("em", "", h1).textContent = m.title[1];
    const logo = el("img", "", band);
    logo.src = "src/logo.png";
    logo.alt = "";
    await logo.decode();
    await document.fonts.ready;
    document.title = "ready";
}

draw();
</script>
</body>
</html>
