    <title id="s1-module-programming-interface-title">S1 Module wiring to a J-Link 20 pin SWD interface: pin 20 GND goes to J-Link GND on pin 4, pin 19 SWDCLK to TCK on pin 9, pin 18 SWDIO to TMS on pin 7, and pin 17 VnRF / VADC to VTREF on pin 1.</title>

