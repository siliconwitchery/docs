<figure class="diagram">
<svg viewBox="0 0 880 450" role="img" aria-labelledby="s1-module-block-diagram-title">
    <title id="s1-module-block-diagram-title">S1 Module block diagram: the nRF52 (Bluetooth 5.2, 64MHz Cortex M4) exposes 2x GPIO / ADC, and connects over SPI to the flash, which holds FPGA bootcode and user storage, and to the iCE40 FPGA. The nRF52 controls the PMIC over I2C. The PMIC (buck-boost / LDO, cell charger) takes V-charge in, connects to V-battery, and outputs 1.8V to the nRF52 and outside the module, LDO out and buck-boost out. It sends power control to the iCE40 FPGA (5k + LUTs and DSP cores), which exposes 8x GPIO supporting I3C, I2C and SPI.</title>

    <defs>
        <marker id="s1-module-block-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path class="arrowhead" d="M0 0 L10 5 L0 10 z" />
        </marker>
    </defs>

    <!-- blocks -->
    <rect class="block" x="193.5" y="20" width="173" height="173" />
    <text class="block-title" x="280" y="83">nRF52</text>
    <text class="block-text" x="280" y="113.2">Bluetooth 5.2</text>
    <text class="block-text" x="280" y="138.4">64MHz Cortex M4</text>
    <rect class="block" x="513.1" y="20" width="173" height="173" />
    <text class="block-title" x="599.6" y="83">Flash</text>
    <text class="block-text" x="599.6" y="113.2">FPGA bootcode</text>
    <text class="block-text" x="599.6" y="138.4">+ User storage</text>
    <rect class="block" x="193.5" y="248.1" width="173" height="173" />
    <text class="block-title" x="280" y="311.1">PMIC</text>
    <text class="block-text" x="280" y="341.3">Buck-boost / LDO</text>
    <text class="block-text" x="280" y="366.5">Cell charger</text>
    <rect class="block" x="513.1" y="248.1" width="173" height="173" />
    <text class="block-title" x="599.6" y="311.1">iCE40 FPGA</text>
    <text class="block-text" x="599.6" y="341.3">5k + LUTs</text>
    <text class="block-text" x="599.6" y="366.5">&amp; DSP cores</text>

    <!-- links -->
    <path class="link" d="M20 106.9 H193.5" marker-start="url(#s1-module-block-diagram-arrow)" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="106.7" y="94.9">2x GPIO / ADC</text>
    <path class="link" d="M366.5 106.9 H513.1" marker-start="url(#s1-module-block-diagram-arrow)" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="440" y="94.9">SPI</text>
    <path class="link" d="M440 106.9 V293.8 H513.1" marker-end="url(#s1-module-block-diagram-arrow)" />
    <path class="link" d="M253.9 248.1 V193" marker-end="url(#s1-module-block-diagram-arrow)" />
    <path class="link" d="M253.9 220.8 H20" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="106.7" y="208.8">1.8V out</text>
    <path class="link" d="M314.8 193 V248.1" marker-start="url(#s1-module-block-diagram-arrow)" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label" x="322.8" y="220.6">I2C</text>
    <path class="link" d="M20 276.6 H193.5" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="106.7" y="264.6">V-charge in</text>
    <path class="link" d="M20 319 H193.5" marker-start="url(#s1-module-block-diagram-arrow)" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="106.7" y="307">V-battery</text>
    <path class="link" d="M20 361 H193.5" marker-start="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="106.7" y="349">LDO out</text>
    <path class="link" d="M20 403.5 H193.5" marker-start="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="106.7" y="391.5">Buck-boost out</text>
    <path class="link" d="M366.5 371.1 H513.1" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="439.8" y="359.1">Power control</text>
    <path class="link" d="M686.5 334.2 H860" marker-start="url(#s1-module-block-diagram-arrow)" marker-end="url(#s1-module-block-diagram-arrow)" />
    <text class="link-label middle" x="773.3" y="322.2">8x GPIO</text>
    <text class="link-label middle" x="773.3" y="352.2">Supporting</text>
    <text class="link-label middle" x="773.3" y="372.2">I3C / I2C / SPI</text>
</svg>
</figure>
