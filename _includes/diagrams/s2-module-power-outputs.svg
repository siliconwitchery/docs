<figure class="diagram">
<svg viewBox="0 0 880 440" role="img" aria-labelledby="s2-module-power-outputs-title">
    <title id="s2-module-power-outputs-title">S2 Module power outputs: ports A, B and C on the left edge carry VOUT1 on pin 2, and ports D, E and F on the right edge carry VOUT2 on pin 2. Pin 1 of every IO port is GND, and the remaining pins are IO, not power. The external power port outputs VSYS on pin 1 and has GND on pin 3. Its pin 2 is the VIN input, not an output.</title>

