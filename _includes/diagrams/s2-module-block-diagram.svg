<figure class="diagram">
<svg viewBox="0 0 880 660" role="img" aria-labelledby="s2-module-block-diagram-title">
    <title id="s2-module-block-diagram-title">S2 Module block diagram: inside the S2 Module, the nRF9151 cellular SoC drives the LTE antenna, which links to the cellular network, and the GNSS antenna, which links to satellites. The pairing button feeds the nRF9151, and the nRF9151 drives the status LEDs. The nRF9151 exchanges data with the 6x IO ports, which offer GPIO, I2C, SPI and analog to external devices, and with the nPM1300 PMIC. The PMIC takes power from the USB power port, exchanges power with the external power port and the battery port, and supplies VIO1 and VIO2 to the IO ports.</title>

    <defs>
        <marker id="s2-module-block-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path class="arrowhead" d="M0 0 L10 5 L0 10 z" />
        </marker>
    </defs>

    <!-- blocks -->
    <rect class="block" x="120" y="150" width="610" height="489" />
    <text class="block-title" x="435" y="172">S2 Module</text>
    <rect class="block" x="140" y="195" width="275" height="56" />
    <text class="block-title" x="277.5" y="223">LTE Antenna</text>
    <rect class="block" x="435" y="195" width="275" height="56" />
    <text class="block-title" x="572.5" y="223">GNSS Antenna</text>
    <rect class="block" x="140" y="287" width="170" height="56" />
    <text class="block-title" x="225" y="315">Pairing Button</text>
    <rect class="block" x="140" y="379" width="170" height="56" />
    <text class="block-title" x="225" y="407">Status LEDs</text>
    <rect class="block" x="140" y="471" width="170" height="56" />
    <text class="block-title" x="225" y="499">USB Power Port</text>
    <rect class="block" x="140" y="563" width="170" height="56" />
    <text class="block-title" x="225" y="591">Ext Power Port</text>
    <rect class="block" x="350" y="287" width="150" height="148" />
    <text class="block-title" x="425" y="349">nRF9151</text>
    <text class="block-text" x="425" y="375">Cellular SoC</text>
    <rect class="block" x="350" y="471" width="150" height="148" />
    <text class="block-title" x="425" y="533">nPM1300</text>
    <text class="block-text" x="425" y="559">PMIC</text>
    <rect class="block" x="540" y="287" width="170" height="148" />
    <text class="block-title" x="625" y="315">6x IO Ports</text>
    <text class="block-text" x="625" y="343">GPIO</text>
    <text class="block-text" x="625" y="365">I<tspan class="sub" dy="-5">2</tspan><tspan dy="5">C</tspan></text>
    <text class="block-text" x="625" y="387">SPI</text>
    <text class="block-text" x="625" y="409">Analog</text>
    <rect class="block" x="540" y="563" width="170" height="56" />
    <text class="block-title" x="625" y="591">Battery Port</text>

