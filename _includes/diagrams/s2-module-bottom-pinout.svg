<figure class="diagram">
<svg viewBox="0 0 880 440" role="img" aria-labelledby="s2-module-bottom-pinout-title">
    <title id="s2-module-bottom-pinout-title">S2 Module bottom pinout: pogo pin pads that carry the same signals as the top connectors, mirrored. IO ports F, E and D are on the left edge, top to bottom, and IO ports A, B and C on the right edge, top to bottom. Ports A and B: pin 1 GND, pin 2 VOUT1, pin 3 A0 or B0, pin 4 A1 or B1. Port C: pin 1 GND, pin 2 VOUT1, pins 3 to 7 C0 to C4. Ports E and F: pin 1 GND, pin 2 VOUT2, pin 3 E0 or F0, pin 4 E1 or F1. Port D: pin 1 GND, pin 2 VOUT2, pins 3 to 7 D0 to D4. C2 to C4 and D0 to D4 support analog input. The battery port pads on the bottom left are pin 1 VBATT and pin 2 GND. The power port pads on the bottom right are pin 1 VSYS, pin 2 VIN and pin 3 GND.</title>

